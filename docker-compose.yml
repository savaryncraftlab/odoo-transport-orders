# Local development only: Odoo 19 + PostgreSQL 16.
# The passwords below are throwaway values for a database that never leaves this machine.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    # -d odoo: create/use the database "odoo"; --dev=xml: view changes show up after a page refresh
    command: odoo -d odoo --db-filter=^odoo$$ --dev=xml

volumes:
  odoo-db:
  odoo-data:
